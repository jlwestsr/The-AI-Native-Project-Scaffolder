# Optional ML / ops extras on top of base.
# Prefer keeping product code under src/{{ project_slug }}; these dirs support
# data science and workstation Ansible profiles — omit via a leaner profile if unused.
[directories]
root = [
    "notebooks",
    "models",
    "data/raw",
    "data/processed",
    "ansible/roles",
    "ansible/group_vars",
    "ansible/host_vars",
    "src/data",
    "src/features",
    "src/models",
    "src/visualization",
]

[files]
"Dockerfile" = "Dockerfile.j2"
"docker-compose.yml" = "docker-compose.yml.j2"
"mkdocs.yml" = "mkdocs.yml.j2"
"ansible/ansible.cfg" = "ansible/ansible.cfg.j2"
"ansible/inventory.ini" = "ansible/inventory.ini.j2"
"ansible/setup_workstation.yml" = "ansible/setup_workstation.yml.j2"

[conditionals]
"Dockerfile" = "use_docker"
"docker-compose.yml" = "use_docker"
