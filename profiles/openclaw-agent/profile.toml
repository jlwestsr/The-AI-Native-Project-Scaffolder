[profile]
name = "openclaw-agent"
description = "OpenClaw agent deployment — identity, SOUL.md, and runtime config"
inherits = "claude-governance"

[variables.agent_name]
prompt = "Agent name (e.g. Rook, Cael, Moto)"
type = "string"

[variables.agent_emoji]
prompt = "Agent emoji"
type = "string"
default = "🤖"

[variables.agent_tagline]
prompt = "One-line agent tagline (personality summary)"
type = "string"
default = "Direct. Resourceful. No fluff."

[variables.runtime]
prompt = "Runtime type"
type = "choice"
choices = ["docker", "bare-metal", "systemd"]
default = "docker"

[variables.primary_model]
prompt = "Primary LLM model"
type = "string"
default = "ollama/qwen2.5:14b"

[variables.fallback_model]
prompt = "Fallback LLM model"
type = "string"
default = "ollama/qwen2.5:14b"

[variables.host]
prompt = "Target host (e.g. shurtugal-lnx, nebulus)"
type = "string"
default = "shurtugal-lnx"

[variables.gateway_port]
prompt = "Gateway port"
type = "string"
default = "18792"

[variables.subagent_model]
prompt = "Sub-agent LLM model"
type = "string"
default = "ollama/qwen2.5:14b"

[variables.max_subagents]
prompt = "Max concurrent sub-agents"
type = "string"
default = "2"

[variables.discord_channel_id]
prompt = "Primary Discord channel ID (agent's office)"
type = "string"
default = ""
