[directories]
root = [
    "src/{{ project_slug }}",
    "tests",
    "docs",
    "docs/features",
    "docs/ops",
    "docs/decisions",
    "scripts",
    "workspace/scratchpad",
    "agents",
    "tools/prompts",
    ".agent/rules",
    ".claude/hooks",
    ".claude/skills",
    ".github/workflows",
]

[files]
"README.md" = "README.md.j2"
"CONTEXT.md" = "CONTEXT.md.j2"
